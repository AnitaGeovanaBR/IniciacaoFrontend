  <path d="M4 2.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5zm0 4a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm3-6a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm3-6a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5z"/>

  <h1>Calculadora</h1>
</div>

<div class="calculadora-container">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div>
      <label for="primeiroNumero">Primeiro número</label>
      <input id="primeiroNumero" type="text" formControlName="primeiroNumero" />
      <span class="erro-validacao" *ngIf="form.get('primeiroNumero')?.hasError('naoENumero') && form.get('primeiroNumero')?.touched">
        Apenas números são permitidos
      </span>
    </div>

    <div>
      <label for="operacao">Operação</label>
      <select id="operacao" formControlName="operacao">
        <option disabled>Selecione</option>
        <option *ngFor="let op of operacoes" [value]="op.valor">{{op.nome}} ({{op.valor}})</option>
      </select>
    </div>

    <div>
      <label for="segundoNumero">Segundo número</label>
      <input id="segundoNumero" type="text" formControlName="segundoNumero" />
      <span class="erro-validacao" *ngIf="form.get('segundoNumero')?.hasError('naoENumero') && form.get('segundoNumero')?.touched">
        Apenas números são permitidos
      </span>
    </div>

    <div class="actions">
      <button type="submit">Calcular</button>
    </div>
  </form>

  <div *ngIf="resultado !== null" class="resultado">
    <strong>{{ expressao }}</strong>
  </div>
</div>

<div *ngIf="mostrarModal" class="modal-overlay" (click)="fecharModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Erro</h2>
      <button class="modal-close" (click)="fecharModal()">&times;</button>
    </div>
    <div class="modal-body">
      <p>{{ erro }}</p>
    </div>
    <div class="modal-footer">
      <button class="modal-btn" (click)="fecharModal()">Fechar</button>
    </div>
  </div>
</div>
