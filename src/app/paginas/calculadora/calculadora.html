  <h1>Calculadora</h1>

<!-- resto do seu conteúdo (mantive seu .calculadora-container abaixo) -->
<div class="calculadora-container">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div>
      <label for="primeiroNumero">Primeiro número</label>
      <input id="primeiroNumero" type="number" formControlName="primeiroNumero" />
    </div>

    <div>
      <label for="operacao">Operação</label>
      <select id="operacao" formControlName="operacao">
        <option disabled selected>Selecione</option>
        <option *ngFor="let op of operacoes" [value]="op.valor">{{op.nome}} ({{op.valor}})</option>
      </select>
    </div>

    <div>
      <label for="segundoNumero">Segundo número</label>
      <input id="segundoNumero" type="number" formControlName="segundoNumero" />
    </div>

    <div class="actions">
      <button type="submit">Calcular</button>
    </div>
  </form>

  <div *ngIf="resultado !== null" class="resultado">
    <strong>Resultado:</strong> {{ resultado }}
  </div>
  <div *ngIf="erro" class="erro">
    <strong>{{ erro }}</strong>
  </div>
</div>
