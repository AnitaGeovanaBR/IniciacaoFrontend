<div id="calculadora">
    <h1>Calculadora Windows XP</h1>
    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-calculator" viewBox="0 0 16 16">
        <path d="M12 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
        <path d="M4 2.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5zm0 4a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm3-6a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm3-6a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5z"/>
    </svg>

    <form [formGroup]="calculadoraForm" (ngSubmit)="calcular()">

        <label>
            Insira o primeiro número :
            <input type="number" formControlName="primeiroNumero">
        </label>
        
        <div class="erro" *ngIf="calculadoraForm.get('primeiroNumero')?.invalid && calculadoraForm.get('primeiroNumero')?.touched">
            O primeiro número é necessário.
        </div>

        <label>
            Operação
            <select formControlName="operacao">
                <option *ngFor="let op of operacoes" [value]="op.valor || op.sigla">{{ op.nome }}</option>
            </select>
        </label>

        <div class="erro" *ngIf="calculadoraForm.get('operacao')?.invalid && calculadoraForm.get('operacao')?.touched">
            A operação é ncessária.
        </div>

        <label>
            Insira o segundo número :
            <input type="number" formControlName="segundoNumero">
        </label>

        <div class="erro" *ngIf="calculadoraForm.get('segundoNumero')?.invalid && calculadoraForm.get('segundoNumero')?.touched">
            O segundo número é necessário.
        </div>

        <button type="submit" [disabled]="calculadoraForm.invalid">
            Calcular
        </button>
    </form>
    <br>
    <div id="apresentarResult">
    <h2>Resultado <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-caret-right-fill" viewBox="0 0 16 16">
    <path d="m12.14 8.753-5.482 4.796c-.646.566-1.658.106-1.658-.753V3.204a1 1 0 0 1 1.659-.753l5.48 4.796a1 1 0 0 1 0 1.506z"/>
    </svg> {{ resultado }}</h2>
    </div>

</div>
